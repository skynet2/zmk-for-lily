# RGB disabled (P0.06 reused for nice!view CS)
CONFIG_ZMK_RGB_UNDERGLOW=n

# nice!view (Sharp LS0xx 160x68, 1bpp)
CONFIG_ZMK_DISPLAY=y
# Full framebuffer — partial VDB corrupts the memory-LCD (striped output)
CONFIG_LV_Z_VDB_SIZE=100
CONFIG_LV_DPI_DEF=161
# Dedicated display work queue so BLE traffic can't starve VCOM/refresh
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=4096
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_PRIORITY=4
